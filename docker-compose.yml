version: '3.8'

networks:
  autoheal_network:
    driver: bridge

volumes:
  mongo_data:

services:
  mongodb:
    image: mongo:6.0
    container_name: autoheal_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - autoheal_network

  backend:
    build: ./backend
    container_name: autoheal_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/autoheal
    depends_on:
      - mongodb
    networks:
      - autoheal_network

  frontend:
    build: ./frontend
    container_name: autoheal_frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:80
    depends_on:
      - backend
    networks:
      - autoheal_network

  nginx:
    image: nginx:alpine
    container_name: autoheal_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - autoheal_network

  prometheus:
    image: prom/prometheus:latest
    container_name: autoheal_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - autoheal_network