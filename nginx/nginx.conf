events { worker_connections 1024; }

http {
    upstream frontend_nodes {
        server frontend:80;
    }

    upstream backend_nodes {
        server backend:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://frontend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}